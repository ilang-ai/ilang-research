{{- $host := (urls.Parse site.BaseURL).Host | default "research.ilang.ai" }}

      <h1>Page not found</h1>
      <p>Sorry, the requested page could not be found.</p>
      <p class="back"><a class="lk" href="{{ "" | absLangURL }}">{{ site.Params.label.text | default site.Title }} <span class="arr fw" aria-hidden="true">→</span></a></p>
    </div>
  </div>
{{ end }}
